# Server configuration
server.port=8080

# Multipart file upload configuration (5MB limit as required)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Application data storage paths
hiremate.data.jobs-path=data/jobs.json
hiremate.data.applications-path=data/applications.json

# Session timeout configuration (30 minutes)
server.servlet.session.timeout=30m

# Logging configuration
logging.level.com.hidani.hiremate=INFO

