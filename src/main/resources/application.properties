# Server configuration (supports dynamic PORT injection on Render/Railway)
server.port=${PORT:8080}

# Multipart file upload configuration (5MB limit as required)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Application data storage paths (supports volume mounts on cloud hosts)
hiremate.data.jobs-path=${JOBS_DATA_PATH:data/jobs.json}
hiremate.data.applications-path=${APPLICATIONS_DATA_PATH:data/applications.json}

# Google Gemini API configuration (optional; falls back seamlessly to rule-based engine if empty)
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

# Session timeout configuration (30 minutes)
server.servlet.session.timeout=30m

# Logging configuration
logging.level.com.hidani.hiremate=INFO

